    <!-- Anti-Flash Theme & Font Scaling Script -->
    <script>
      (function() {
        try {
          const savedTheme = localStorage.getItem('canonify-theme');
          if (savedTheme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.classList.remove('dark');
          }

          const savedFontScale = localStorage.getItem('canonify-font-scale');
          if (savedFontScale && ['decrease', 'normal', 'increase'].includes(savedFontScale)) {
            document.documentElement.setAttribute('data-font-scale', savedFontScale);
          } else {
            document.documentElement.setAttribute('data-font-scale', 'normal');
          }
        } catch (e) {}
      })();
    </script>
