<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found — Canonify</title>
    <meta name="robots" content="noindex, follow" />
    <!-- Favicon & Search Engine Icon Suite -->
    <link rel="icon" type="image/x-icon" href="/Canonify/favicon.ico" />
    <link rel="icon" type="image/png" sizes="48x48" href="/Canonify/favicon-48x48.png" />
    <link rel="icon" type="image/svg+xml" href="/Canonify/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/Canonify/apple-touch-icon.png" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #161320;
        color: #f1edf7;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        position: relative;
        overflow: hidden;
      }
      .bg-glow {
        position: absolute;
        width: 600px;
        height: 600px;
        background: radial-gradient(circle, rgba(76, 63, 107, 0.35) 0%, transparent 70%);
        border-radius: 50%;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
      }
      .card {
        background: #201c2c;
        border: 1px solid #38314a;
        border-radius: 16px;
        padding: 48px 40px;
        max-width: 520px;
        width: 100%;
        text-align: center;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
        position: relative;
        z-index: 2;
      }
      .logo-wrap {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 68px;
        height: 68px;
        border-radius: 50%;
        background: rgba(76, 63, 107, 0.25);
        border: 1px solid rgba(169, 154, 199, 0.4);
        margin-bottom: 24px;
        color: #d3c8e8;
      }
      .badge {
        display: inline-block;
        background: rgba(142, 123, 181, 0.2);
        color: #d3c8e8;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        padding: 4px 12px;
        border-radius: 12px;
        border: 1px solid rgba(169, 154, 199, 0.3);
        margin-bottom: 16px;
      }
      h1 {
        font-family: Georgia, Cambria, serif;
        font-size: 48px;
        font-weight: 700;
        color: #ffffff;
        margin-bottom: 12px;
        line-height: 1.1;
      }
      h2 {
        font-size: 20px;
        font-weight: 600;
        color: #d3c8e8;
        margin-bottom: 16px;
      }
      p {
        font-size: 15px;
        line-height: 1.6;
        color: #c9c1d8;
        margin-bottom: 28px;
      }
      .redirect-note {
        font-size: 13px;
        color: #a99ac7;
        margin-bottom: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
      .spinner {
        width: 14px;
        height: 14px;
        border: 2px solid rgba(169, 154, 199, 0.3);
        border-top-color: #d3c8e8;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      .btn {
        display: inline-block;
        background: #4c3f6b;
        color: #ffffff;
        font-size: 15px;
        font-weight: 600;
        padding: 12px 28px;
        border-radius: 8px;
        text-decoration: none;
        transition: background-color 0.15s ease, transform 0.15s ease;
      }
      .btn:hover {
        background: #5e4d84;
        transform: translateY(-1px);
      }
    </style>
    <script>
      (function() {
        var repoName = '/Canonify';
        var pathname = window.location.pathname;
        var search = window.location.search;
        var hash = window.location.hash;

        // Auto-redirect if accessed within repository scope
        if (pathname.toLowerCase().indexOf(repoName.toLowerCase()) === 0) {
          var sub = pathname.substring(repoName.length).replace(/^\/+/, '');
          if (sub && sub !== '404.html' && sub !== '404') {
            window.location.replace(repoName + '/#/' + sub + search + hash);
            return;
          }
        }
        // Redirect to homepage after brief moment
        setTimeout(function() {
          window.location.replace(repoName + '/#/' + search + hash);
        }, 1200);
      })();
    </script>
  </head>
  <body>
    <div class="bg-glow"></div>
    <main class="card">
      <div class="logo-wrap">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="36" height="36" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="18" cy="4" r="1.5" fill="currentColor" stroke="none" />
          <circle cx="25" cy="4" r="1.5" fill="currentColor" stroke="none" />
          <path d="M 18 5.5 C 18 8, 21.5 9, 21.5 11" />
          <path d="M 25 5.5 C 25 8, 21.5 9, 21.5 11" />
          <path d="M 21.5 11 C 13.5 11, 6 15, 6 21 C 6 27, 13.5 29, 21 29" />
          <circle cx="23.5" cy="28.5" r="2.5" fill="currentColor" />
          <circle cx="23.5" cy="28.5" r="1.1" fill="#201c2c" stroke="none" />
        </svg>
      </div>
      <div>
        <span class="badge">Error 404</span>
      </div>
      <h1>Page Not Found</h1>
      <h2>Canonify Document Archive</h2>
      <p>
        The document or page you requested could not be located at this URL. You are being redirected to the Canonify NEET UG Counselling Directory.
      </p>
      <div class="redirect-note">
        <span class="spinner"></span> Redirecting to directory...
      </div>
      <a href="/Canonify/#/" class="btn">Return to Home Directory</a>
    </main>
  </body>
</html>
